<svg xmlns="http://www.w3.org/2000/svg" width="840" height="196" viewBox="0 0 840 196" role="img">
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
@keyframes shimmer{0%{transform:translateY(-120px)}100%{transform:translateY(220px)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{r:4;opacity:.8}100%{r:11;opacity:0}}
@keyframes nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(5px)}}
.sh{animation:shimmer 3.2s ease-in-out infinite}
.in{opacity:0;animation:in .6s ease-out forwards}
.pl{animation:pulse 1.8s ease-out infinite}
.ar{animation:nudge 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<title>Lembrete de Cancelamentos — Lê a planilha de pedidos de cancelamento e envia todo dia útil aos supervisores um e-mail com as pendências, das mais antigas às mais novas.</title>
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="bar"><rect x="0" y="0" width="4" height="196"/></clipPath>
<clipPath id="cardclip"><rect width="840" height="196" rx="14"/></clipPath>
</defs>
<rect x=".5" y=".5" width="839" height="195" rx="14" fill="#161b22" stroke="#30363d"/>
<g clip-path="url(#cardclip)"><rect width="4" height="196" fill="url(#acc)"/><g clip-path="url(#bar)"><rect class="sh" width="4" height="100" fill="url(#shine)"/></g></g>
<g class="in" style="animation-delay:.05s">
<rect x="32" y="28" width="60" height="60" rx="16" fill="url(#acc)"/>
<g transform="translate(62 58)"><rect x="-16" y="-10" width="26" height="19" rx="3" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M-15 -8l12 9 12-9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="11" cy="8" r="8" fill="#161b22" stroke="#fff" stroke-width="2.2"/><path d="M11 4v4l3 2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
</g>
<g class="in" style="animation-delay:.15s"><text x="116" y="52" font-size="21" font-weight="700" fill="#e6edf3">Lembrete de Cancelamentos</text></g>
<g class="in" style="animation-delay:.2s">
<rect x="678.0" y="27" width="134.0" height="26" rx="13" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".5"/>
<text x="689.0" y="44.5" font-size="12.5" font-weight="600" fill="#58a6ff">Automação diária</text>
</g>
<g class="in" style="animation-delay:.3s"><text x="116" y="94" font-size="14.5" fill="#8b949e">Lê a planilha de pedidos de cancelamento e envia todo dia útil aos</text><text x="116" y="116" font-size="14.5" fill="#8b949e">supervisores um e-mail com as pendências, das mais antigas às mais novas.</text></g>
<g class="in" style="animation-delay:.4s"><rect x="116.0" y="148" width="146.0" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".35"/><text class="mono" x="189.0" y="164" font-size="12" fill="#e6edf3" text-anchor="middle">Google Apps Script</text><rect x="270.0" y="148" width="62.0" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".35"/><text class="mono" x="301.0" y="164" font-size="12" fill="#e6edf3" text-anchor="middle">Sheets</text><rect x="340.0" y="148" width="55.0" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".35"/><text class="mono" x="367.5" y="164" font-size="12" fill="#e6edf3" text-anchor="middle">Gmail</text></g>
<g class="in" style="animation-delay:.5s"><text x="788" y="165" font-size="13.5" font-weight="600" fill="#58a6ff" text-anchor="end">Ver repositório</text><g class="ar"><path d="M796 160h12m-5-5 5 5-5 5" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
